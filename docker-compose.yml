services:
  poker-polacco:
    build: .
    container_name: poker-polacco
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      TURN_SECONDS: ${TURN_SECONDS:-45}
      RECONNECT_SECONDS: ${RECONNECT_SECONDS:-60}
      REVEAL_SECONDS: ${REVEAL_SECONDS:-2}
      RESULT_SECONDS: ${RESULT_SECONDS:-3}
      ENABLE_DEBUG: "false"
    ports:
      - "${HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
